port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies:
  - name: "🇨🇳 国内BGP中转 | VMESS (84ms)"
    type: vmess
    server: fullaccesstohongkongnet.azurewebsites.net
    port: 443
    uuid: 274f11c6-f69b-40b9-8966-f39e06e97be7
    alterId: 0
    cipher: auto
    tls: true
    udp: true
    skip-cert-verify: true
    network: ws
    ws-opts:
      path: "/ws"
      headers:
        Host: "fullaccesstohongkongnet.azurewebsites.net"
  - name: "🇨🇳 国内BGP中转 | VMESS (64ms)"
    type: vmess
    server: 112.132.215.108
    port: 50002
    uuid: 418048af-a293-4b99-9b0c-98ca3580dd24
    alterId: 64
    cipher: auto
    udp: true
    skip-cert-verify: true
    network: tcp

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ⚡ 自动选择
      - DIRECT
      - "🇨🇳 国内BGP中转 | VMESS (84ms)"
      - "🇨🇳 国内BGP中转 | VMESS (64ms)"

  - name: ⚡ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "🇨🇳 国内BGP中转 | VMESS (84ms)"
      - "🇨🇳 国内BGP中转 | VMESS (64ms)"

dns:
  enable: true
  nameserver:
    - 223.5.5.5
    - 8.8.8.8
  fallback:
    - 8.8.8.8
    - 1.1.1.1

rules:
  - GEOIP,CN,DIRECT
  - DOMAIN-SUFFIX,wechat.com,DIRECT
  - DOMAIN-SUFFIX,qq.com,DIRECT
  - DOMAIN-SUFFIX,bilibili.com,DIRECT
  - DOMAIN-SUFFIX,alicdn.com,DIRECT
  - DOMAIN-SUFFIX,163.com,DIRECT
  - DOMAIN-SUFFIX,csdn.net,DIRECT
  - DOMAIN-SUFFIX,zhihu.com,DIRECT
  - DOMAIN-SUFFIX,taobao.com,DIRECT
  - MATCH,🚀 节点选择
